name = "sinkker"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# Runtime-configurable values.
# BLOCKLIST_URL and UPSTREAM_URL here are default built-in,
# They are overridden in the dashboard and stored in KV
# Variables are used for dashboard-less deployment without setting DASHBOARD_PASSWORD
[vars]
BLOCKLIST_URL = "https://raw.githubusercontent.com/cbuijs/hagezi/refs/heads/main/lists/pro-plus/domains"
UPSTREAM_URL = "https://dns.quad9.net/dns-query"
# UPSTREAM_FALLBACK_URL = "https://dns.google/dns-query"  # failover DoH (see docs/configuration.md)

# Static dashboard UI served as a Worker asset (no template-in-JS).
# The Worker only runs for these paths; everything else (static files,
# /dashboard SPA fallback) is served directly from assets:
#   "/"        -> worker redirect for browsers (HTML -> /dashboard)
#   "/api/*"   -> dashboard JSON API
#   "/dns-query" -> DoH endpoint
#   "/healthz" -> health/stats JSON
[assets]
directory = "./assets"
binding = "ASSETS"
#   "/api/*"   -> dashboard JSON API (glob `*` is required: "/api/" alone
#                 matches only the literal path /api/, and API subpaths would
#                 fall through to assets + SPA fallback -> HTML -> null JSON)
# A trailing client tag on the DoH endpoint (/dns-query/<tag>) must also reach
# the script, so the suffix path needs its own glob: deep paths need `*`.
run_worker_first = ["/api/*", "/dns-query", "/dns-query/*", "/healthz", "/healthz/*", "/"]
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"

# KV for settings and all filtering rules (required for the dashboard).
# Preview for development
#   wrangler kv:namespace create RULES
#   wrangler kv:namespace create RULES --preview
[[kv_namespaces]]
binding = "RULES"
id = "c1274ab8f14b4dfcac2cd91af7bfda82"
# preview_id = "changeme"

# Dashboard password (optional but recommended). Set with:
#   wrangler secret put DASHBOARD_PASSWORD
# When unset the dashboard is disabled (DoH filtering still works).
#
# Code constants (blocklist.js, NOT deploy vars — values in docs/configuration.md):
#   MAX_BLOCKLIST_URLS     = 10          max concurrent subscriptions
#   BLOCKLIST_ENTRY_LIMIT  = 1_000_000  merged-entry ceiling across subscriptions
#   MAX_SOURCE_ENTRIES     = 400_000    per-document entry cap (refused before parse)
#   MAX_SOURCE_BYTES       = 24 MiB     per-document size cap (refused before parse)


# D1 database, optional but enables the logs tab
#   wrangler d1 create dns-logs
#   wrangler d1 execute dns-logs --file=./schema.sql
[[d1_databases]]
binding = "LOGS"
database_name = "dns-logs"
database_id = "295f7331-0f31-42bb-8610-640eb0e38de5"

# Durable Object build farm: parses huge TIF sources and publishes the
# XOR-16 filter + sorted chunks to KV (free plan: SQLite-backed class).
[durable_objects]
bindings = [
  { name = "TIF_BUILDER", class_name = "TifBuilder" },
  { name = "BL_BUILDER", class_name = "BlocklistBuilder" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TifBuilder"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["BlocklistBuilder"]


# Daily cron trigger to force blocklist/TIF refresh
[[triggers]]
crons = ["0 3 * * *"]: # 03:00 UTC daily
